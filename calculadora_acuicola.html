<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora acuícola · gestión de estanques</title>
<style>
:root{
  --verde:#1f6f4a; --verde-osc:#14503a; --verde-suave:#e6f2ea; --crema:#faf8f2;
  --tierra:#8b6b4a; --texto:#222a26; --gris:#66736c; --borde:#d7ddd8; --blanco:#fff;
  --ok:#1a7f4b; --ok-bg:#e3f4ea; --err:#b3261e; --err-bg:#fdeceb;
  --adv:#9a6200; --adv-bg:#fff4dd; --rec:#1d5fa8; --rec-bg:#e7f0fb;
  --real:#1f6f4a; --est:#9a6200; --proy:#1d5fa8;
}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--texto);background:var(--crema);line-height:1.45}
.skip{position:absolute;left:-999px;top:0;background:#000;color:#fff;padding:8px 12px;z-index:100}
.skip:focus{left:8px;top:8px}
header.app{background:var(--verde-osc);color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
header.app h1{font-size:1.25rem;margin:0}
header.app small{display:block;color:#cfe5d8;font-weight:400}
.estado-guardado{font-size:.85rem;color:#cfe5d8}
nav.tabs{display:flex;gap:4px;overflow-x:auto;background:var(--verde);padding:6px 8px 0;position:sticky;top:0;z-index:20;-webkit-overflow-scrolling:touch}
nav.tabs button{flex:0 0 auto;border:0;background:transparent;color:#e6f2ea;padding:11px 14px;font:inherit;font-size:.95rem;border-radius:8px 8px 0 0;cursor:pointer;min-height:44px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--crema);color:var(--verde-osc);font-weight:600}
nav.tabs button:hover{background:rgba(255,255,255,.15)}
nav.tabs .cuenta{display:inline-block;min-width:1.4em;padding:0 6px;margin-left:6px;border-radius:10px;font-size:.78rem;background:var(--err);color:#fff;text-align:center}
nav.tabs .cuenta.adv{background:#d89a1d}
main{max-width:1200px;margin:0 auto;padding:16px}
h2{font-size:1.2rem;margin:0 0 4px}
h3{font-size:1.05rem;margin:18px 0 8px}
p.sub{margin:0 0 12px;color:var(--gris)}
.tarjeta{background:var(--blanco);border:1px solid var(--borde);border-radius:12px;padding:14px;margin-bottom:14px}
.tarjeta>h3:first-child{margin-top:0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.grid.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.grid.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.kpi{background:var(--blanco);border:1px solid var(--borde);border-radius:12px;padding:12px}
.kpi .tit{font-size:.82rem;color:var(--gris)}
.kpi .val{font-size:1.45rem;font-weight:650;margin-top:2px;word-break:break-word}
.kpi .det{font-size:.8rem;color:var(--gris)}
.kpi.pos .val{color:var(--ok)} .kpi.neg .val{color:var(--err)}
.campo{display:flex;flex-direction:column;gap:3px}
.campo label{font-size:.88rem;font-weight:600}
.campo .entrada{display:flex;align-items:stretch}
.campo input,.campo select,.campo textarea{font:inherit;width:100%;min-height:44px;padding:8px 10px;border:1px solid #aab5ae;border-radius:8px;background:#fff;color:var(--texto)}
.campo .entrada input{border-top-right-radius:0;border-bottom-right-radius:0}
.campo .unidad{display:flex;align-items:center;padding:0 10px;background:var(--verde-suave);border:1px solid #aab5ae;border-left:0;border-radius:0 8px 8px 0;font-size:.85rem;color:var(--verde-osc);white-space:nowrap}
.campo textarea{min-height:70px}
.campo .ayuda{font-size:.78rem;color:var(--gris)}
.campo input[readonly]{background:#f1f4f2}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #f0b429;outline-offset:1px}
button.btn,a.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border:0;border-radius:8px;background:var(--verde);color:#fff;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
button.btn:hover{background:var(--verde-osc)}
button.btn.sec{background:#fff;color:var(--verde-osc);border:1px solid var(--verde)}
button.btn.peligro{background:var(--err)}
button.btn.chico{min-height:36px;padding:4px 10px;font-size:.88rem}
.acciones{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tabla-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:7px 9px;border-bottom:1px solid var(--borde);text-align:right;white-space:nowrap}
th:first-child,td:first-child,td.izq,th.izq{text-align:left}
thead th{background:var(--verde-suave);color:var(--verde-osc);position:sticky;top:0}
tr.anulado td{text-decoration:line-through;color:var(--gris)}
tfoot td{font-weight:700;background:#f6f8f6}
.etq{display:inline-block;padding:1px 8px;border-radius:10px;font-size:.74rem;font-weight:700;vertical-align:middle;border:1px solid}
.etq.real{color:var(--real);border-color:var(--real);background:var(--verde-suave)}
.etq.est{color:var(--est);border-color:var(--est);background:var(--adv-bg)}
.etq.proy{color:var(--proy);border-color:var(--proy);background:var(--rec-bg)}
.etq.ej{color:#6b3fa0;border-color:#6b3fa0;background:#f1eafa}
.pos{color:var(--ok)} .neg{color:var(--err)}
.alerta{border-left:6px solid;border-radius:8px;padding:10px 12px;margin-bottom:10px;background:#fff;border-top:1px solid var(--borde);border-right:1px solid var(--borde);border-bottom:1px solid var(--borde)}
.alerta.error{border-left-color:var(--err);background:var(--err-bg)}
.alerta.advertencia{border-left-color:#d89a1d;background:var(--adv-bg)}
.alerta.recomendacion{border-left-color:var(--rec);background:var(--rec-bg)}
.alerta .nivel{font-weight:700;text-transform:uppercase;font-size:.78rem;letter-spacing:.04em}
.alerta dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.9rem}
.alerta dt{font-weight:600} .alerta dd{margin:0}
.aviso{border-radius:8px;padding:9px 12px;margin:8px 0;font-size:.9rem;border:1px solid}
.aviso.error{background:var(--err-bg);border-color:var(--err);color:#6f1511}
.aviso.adv{background:var(--adv-bg);border-color:#d89a1d;color:#5c3b00}
.aviso.info{background:var(--rec-bg);border-color:var(--rec);color:#12396a}
.aviso.ok{background:var(--ok-bg);border-color:var(--ok);color:#0f4d2c}
.vacio{color:var(--gris);padding:18px;text-align:center;border:1px dashed var(--borde);border-radius:10px;background:#fff}
.formula{font-family:ui-monospace,Consolas,monospace;font-size:.84rem;background:#f4f6f4;border-radius:6px;padding:2px 6px}
.cargando{display:flex;align-items:center;gap:10px;color:var(--gris);padding:20px}
.cargando::before{content:"";width:20px;height:20px;border:3px solid var(--borde);border-top-color:var(--verde);border-radius:50%;animation:giro .8s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
.leyenda{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.82rem;color:var(--gris);margin:4px 0}
svg.grafico{width:100%;height:auto;max-height:340px;display:block}
.fila-filtros{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:12px}
details.plegable{margin:8px 0}
details.plegable>summary{cursor:pointer;font-weight:600;padding:6px 0}
dialog{border:0;border-radius:12px;padding:18px;max-width:min(92vw,440px);box-shadow:0 10px 40px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.45)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#222a26;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;max-width:92vw}
#toast.ver{opacity:1}
#reporte{display:none}
body.ver-reporte #reporte{display:block;position:fixed;inset:0;overflow:auto;background:#fff;z-index:50;padding:16px}
.reporte-barra{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.reporte h1{font-size:1.4rem;margin:0 0 2px}
.reporte table{font-size:.82rem}
@media (max-width:640px){
  main{padding:10px}
  .kpi .val{font-size:1.2rem}
  th,td{padding:6px 7px}
  nav.tabs button{padding:10px 11px;font-size:.9rem}
  .grid,.grid.g2,.grid.g3{grid-template-columns:1fr}
  .grid.kpis{grid-template-columns:repeat(2,1fr)}
}
@media print{
  body{background:#fff}
  body>*:not(#reporte){display:none!important}
  body.ver-reporte #reporte{display:block;position:static;padding:0}
  .reporte-barra{display:none!important}
  .tarjeta{break-inside:avoid;border-color:#999}
  .tabla-wrap{overflow:visible}
  svg.grafico{max-height:230px}
}
</style>

<body>
<a class="skip" href="#principal">Saltar al contenido</a>
<header class="app">
  <div><h1>Calculadora acuícola<small>Gestión de estanques · población, biomasa, alimento, F.C.A. y economía</small></h1></div>
  <div class="estado-guardado" id="estado-guardado" aria-live="polite">Cargando…</div>
</header>
<nav class="tabs" id="tabs" role="tablist" aria-label="Secciones"></nav>
<main id="principal" role="tabpanel" tabindex="-1"><div class="cargando">Cargando la aplicación…</div></main>
<dialog id="dlg" aria-labelledby="dlg-titulo"><form method="dialog"><h3 id="dlg-titulo" style="margin-top:0"></h3><p id="dlg-texto"></p><div class="acciones"><button class="btn sec" value="no">Cancelar</button><button class="btn peligro" value="si" id="dlg-ok">Confirmar</button></div></form></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<div id="reporte" class="reporte" aria-label="Reporte imprimible"></div>
<script>
/*<PURE>*/
'use strict';
/* ==========================================================================
   NÚCLEO DE CÁLCULO (sin interfaz). Todas las fórmulas están documentadas en
   FORMULAS (se muestran en la aplicación). Unidades: g, kg, m², m³, ha, días.
   ========================================================================== */
const MS_DIA = 86400000;
const CATEGORIAS_COSTO = ['Semilla (alevines / juveniles)', 'Alimento balanceado', 'Mano de obra', 'Electricidad',
  'Combustible', 'Medicamentos y tratamientos', 'Fertilizantes y otros insumos', 'Mantenimiento del estanque',
  'Transporte', 'Otros gastos'];
const ESTADOS = ['preparado', 'en crianza', 'en cosecha', 'finalizado'];
const CONFIG_DEF = {
  moneda: 'PEN',
  modoClase: true,            // redondeos intermedios como en las hojas de clase (población entera, kg a 2 decimales)
  fcaTotalMetodo: 'ganancia', // 'ganancia' = alimento ÷ incremento de biomasa | 'cosecha' = alimento ÷ biomasa final (hoja del profesor)
  diasSinMuestreo: 30,        // recomendación si pasan más días sin medir
  tolDesvioPct: 200,          // alerta si el incremento diario cambia más de X % respecto al período anterior
  tolProyPct: 25,             // alerta si el peso real difiere más de X % del plan
  tolBiomasaPct: 10           // alerta si la biomasa medida difiere más de X % de la calculada
};
const FORMULAS = [
  ['Densidad por área', 'organismos ÷ área (m²)'],
  ['Densidad por volumen', 'organismos ÷ volumen (m³), con volumen = área × profundidad'],
  ['Organismos vivos estimados', 'población inicial × supervivencia'],
  ['Mortalidad estimada', 'población inicial − organismos vivos'],
  ['Biomasa (kg)', 'población × peso promedio (g) ÷ 1000'],
  ['Biomasa por hectárea', 'biomasa (kg) × 10 000 ÷ área (m²)'],
  ['Alimento diario (kg)', 'biomasa (kg) × tasa de alimentación (%) ÷ 100'],
  ['Alimento de un período (kg)', 'biomasa al inicio × tasa ÷ 100 × días del período'],
  ['F.C.A.', 'alimento (kg) ÷ incremento de biomasa (kg)'],
  ['Incremento de biomasa', 'biomasa actual + biomasa retirada − biomasa anterior'],
  ['Velocidad de crecimiento (g/día)', '(peso actual − peso anterior) ÷ días'],
  ['Peces a comprar', 'peces sembrados ÷ (1 − mortalidad de transporte)'],
  ['Cal / fertilizante (kg)', 'dosis (kg/ha) × área (m²) ÷ 10 000'],
  ['Costo por kg', 'costo total ÷ biomasa producida (kg)'],
  ['Margen', 'ganancia ÷ ingresos (no disponible si los ingresos son 0)'],
  ['Punto de equilibrio (kg)', 'costo total ÷ precio de venta por kg'],
  ['Precio mínimo de venta', 'costo total ÷ biomasa producida (kg)']
];

/* ---------- utilidades numéricas ---------- */
const num = (v) => {
  if (v === null || v === undefined || v === '') return null;
  const n = typeof v === 'number' ? v : Number(String(v).trim().replace(',', '.'));
  return Number.isFinite(n) ? n : null;
};
const r2 = (x) => Math.floor(x * 100 + 0.5 + 1e-9) / 100;   // 2 decimales, mitad hacia arriba (como las hojas)
const rEnt = (x) => Math.floor(x + 0.5 + 1e-9);
const techo = (x) => Math.ceil(Math.round(x * 1e6) / 1e6);
const div = (a, b) => (a === null || b === null || a === undefined || b === undefined || !Number.isFinite(a) || !Number.isFinite(b) || b === 0) ? null : a / b;
const suma = (arr) => arr.reduce((s, v) => s + (Number.isFinite(v) ? v : 0), 0);
const fmt = (x, d = 2) => (x === null || x === undefined || !Number.isFinite(x)) ? '—' :
  x.toLocaleString('es-PE', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtMon = (x, cfg) => (x === null || x === undefined || !Number.isFinite(x)) ? 'N/D' : `${(cfg && cfg.moneda) || 'PEN'} ${fmt(x, 2)}`;
const esc = (s) => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let _uidN = 0;
const uid = (p) => `${p}-${Date.now().toString(36)}${(++_uidN).toString(36)}${Math.floor(Math.random() * 46656).toString(36)}`;

/* ---------- fechas (ISO yyyy-mm-dd) ---------- */
function parseFecha(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
  if (!m) return null;
  const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
  return (d.getUTCFullYear() === +m[1] && d.getUTCMonth() === +m[2] - 1 && d.getUTCDate() === +m[3]) ? d : null;
}
const fechaISO = (d) => d.toISOString().slice(0, 10);
const sumarDias = (iso, n) => { const d = parseFecha(iso); return d ? fechaISO(new Date(d.getTime() + Math.round(n) * MS_DIA)) : null; };
function sumarMeses(iso, n) {
  const d = parseFecha(iso);
  if (!d) return null;
  const y = d.getUTCFullYear() + Math.floor((d.getUTCMonth() + n) / 12), m = (((d.getUTCMonth() + n) % 12) + 12) % 12;
  const ult = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  return fechaISO(new Date(Date.UTC(y, m, Math.min(d.getUTCDate(), ult))));
}
/* con períodos de 30 días las fechas del plan caen el mismo día de cada mes (como en las hojas de clase) */
const fechaDia = (iso, dia, planDias) => (planDias === 30 && dia >= 0 && Number.isInteger(dia / 30)) ? sumarMeses(iso, dia / 30) : sumarDias(iso, dia);
const diasEntre = (a, b) => { const da = parseFecha(a), db = parseFecha(b); return (da && db) ? Math.round((db - da) / MS_DIA) : null; };
const hoyISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const fmtFecha = (iso) => { const d = parseFecha(iso); return d ? `${String(d.getUTCDate()).padStart(2, '0')}/${String(d.getUTCMonth() + 1).padStart(2, '0')}/${d.getUTCFullYear()}` : '—'; };

/* ---------- listas escritas por el usuario ---------- */
function parseLista(txt) {
  const partes = String(txt === null || txt === undefined ? '' : txt).replace(/;/g, ' ').replace(/,/g, ' ').split(/\s+/).filter(Boolean);
  const vals = partes.map(Number);
  return vals.every(Number.isFinite) ? vals : null;
}
function parseRaciones(txt) {
  const vals = parseLista(txt);
  if (vals === null) return { ok: false, error: 'Escribe números separados por comas.' };
  if (!vals.length) return { ok: true, fracs: null };
  if (vals.length === 1) {
    const n = vals[0];
    if (!(n >= 1) || n !== Math.floor(n)) return { ok: false, error: 'Un solo número = veces al día (entero ≥ 1).' };
    return { ok: true, fracs: Array(n).fill(1 / n) };
  }
  if (vals.some((v) => v < 0) || Math.abs(suma(vals) - 100) > 0.5) return { ok: false, error: 'Los porcentajes de las raciones deben sumar 100.' };
  return { ok: true, fracs: vals.map((v) => v / 100) };
}

/* ---------- fórmulas básicas ---------- */
const areaM2 = (e) => { const a = num(e.area); if (a === null) return null; return e.areaUnidad === 'ha' ? a * 10000 : a; };
const volumenM3 = (area, prof) => (area > 0 && num(prof) > 0) ? area * num(prof) : null;
const densidad = (n, area) => (n !== null && area > 0) ? n / area : null;
const vivosEstimados = (pobIni, superv) => (pobIni !== null && superv !== null) ? pobIni * superv / 100 : null;
const biomasaKg = (pob, pesoG, cfg) => {
  if (pob === null || pob === undefined || pesoG === null || pesoG === undefined) return null;
  const b = pob * pesoG / 1000;
  return cfg && cfg.modoClase ? r2(b) : b;
};
const alimentoDiario = (bio, tasa) => (bio === null || tasa === null || bio === undefined || tasa === undefined) ? null : bio * tasa / 100;
const supervivenciaDesde = (mort) => (mort && mort.length) ? mort.reduce((s, m) => s * (1 - m / 100), 1) * 100 : null;
function fca(alimento, incremento) {
  if (alimento === null || alimento === undefined || incremento === null || incremento === undefined) return { valor: null, motivo: 'Faltan datos de alimento o de biomasa.' };
  if (alimento < 0) return { valor: null, motivo: 'El alimento es negativo.' };
  if (!(incremento > 0)) return { valor: null, motivo: 'El incremento de biomasa es cero o negativo: el F.C.A. no se puede calcular.' };
  return { valor: alimento / incremento, motivo: null };
}

/* ---------- plan de crecimiento ---------- */
function planDe(e, esp) {
  const p = e.plan || {};
  const pick = (a, b) => (Array.isArray(a) && a.length ? a : (Array.isArray(b) ? b : []));
  return {
    planDias: num(p.planDias) || (esp && num(esp.planDias)) || 30,
    pesos: pick(p.pesos, esp && esp.pesosEsperados),
    mortalidades: pick(p.mortalidades, esp && esp.mortalidadPeriodo),
    tasas: pick(p.tasas, esp && esp.tasasPeriodo)
  };
}
function interpPlan(pts, t) {
  if (!pts.length || t < pts[0][0] - 1e-9) return null;
  for (let i = 0; i < pts.length - 1; i++) {
    const [t0, v0] = pts[i], [t1, v1] = pts[i + 1];
    if (t <= t1 + 1e-9) return t1 === t0 ? v1 : v0 + (v1 - v0) * (t - t0) / (t1 - t0);
  }
  const u = pts[pts.length - 1];
  return Math.abs(t - u[0]) < 1e-9 ? u[1] : null;
}
function interpPlanTol(pts, t) {
  const v = interpPlan(pts, t);
  if (v !== null || !pts.length) return v;
  const u = pts[pts.length - 1];
  return (t > u[0] && t - u[0] <= 3) ? u[1] : null;   // hasta 3 días después del fin del plan se usa el último peso
}
const puntosPlan = (plan, pesoIni) => [[0, pesoIni]].concat(plan.pesos.map((w, i) => [(i + 1) * plan.planDias, w]));
function factorSupervivencia(mort, planDias, t, d) {
  let f = 1, a = t;
  const b = t + d;
  while (a < b - 1e-9) {
    const idx = Math.floor(a / planDias + 1e-9);
    const o = Math.min(b, (idx + 1) * planDias) - a;
    const m = idx < mort.length ? mort[idx] : 0;
    f *= Math.pow(1 - m / 100, o / planDias);
    a += o;
  }
  return f;
}
const tasaPlanEn = (plan, dias) => plan.tasas.length ? plan.tasas[Math.min(Math.max(0, Math.floor(dias / plan.planDias + 1e-9)), plan.tasas.length - 1)] : null;

/* ---------- proyección ----------
   o: { cfg, inicioDias, fechaSiembra, pobInicial, pesoInicial, pasoDias, horizonteDias, planDias,
        modelo:{tipo:'pesos'|'gdp'|'tce', pesos, pesoSiembra, gdp, tce}, ajustarAReal,
        mortalidades, supervivenciaConstante, tasas, pesoObjetivo }                         */
function proyectar(o) {
  const cfg = o.cfg || CONFIG_DEF;
  const errores = [], avisos = [];
  const planDias = o.planDias || 30;
  let t = o.inicioDias || 0;
  let pob = o.pobInicial;
  const w0 = o.pesoInicial;
  if (!(pob > 0) || !(w0 > 0)) return { rows: [], resumen: null, errores: ['Faltan la población o el peso de partida para proyectar.'], avisos };
  if (!(o.pasoDias > 0) || !(o.horizonteDias > 0)) return { rows: [], resumen: null, errores: ['El paso y el horizonte de la proyección deben ser mayores que 0.'], avisos };
  const fin = t + o.horizonteDias;
  const m = o.modelo || {};
  let pts = null, escala = 1;
  if (m.tipo === 'pesos') {
    if (!m.pesos || !m.pesos.length) return { rows: [], resumen: null, errores: ['No hay pesos esperados por período. Escríbelos o configura la especie.'], avisos };
    pts = puntosPlan({ planDias, pesos: m.pesos }, m.pesoSiembra);
    const pp = interpPlan(pts, t);
    if (pp === null) return { rows: [], resumen: null, errores: ['El plan de pesos no cubre el día de inicio de la proyección.'], avisos };
    if (o.ajustarAReal && pp > 0) escala = w0 / pp;
  } else if (m.tipo === 'gdp') {
    if (num(m.gdp) === null) return { rows: [], resumen: null, errores: ['Indica la ganancia diaria de peso (g/día).'], avisos };
    avisos.push('Supuesto explícito: la ganancia de peso diaria se mantiene constante.');
  } else if (m.tipo === 'tce') {
    if (num(m.tce) === null) return { rows: [], resumen: null, errores: ['Indica la tasa de crecimiento específico (%/día).'], avisos };
    avisos.push('Supuesto explícito: la tasa de crecimiento específico (%/día) se mantiene constante.');
  } else return { rows: [], resumen: null, errores: ['Elige un modelo de crecimiento.'], avisos };
  const pesoEn = (tt) => {
    if (m.tipo === 'pesos') { const v = interpPlan(pts, tt); return v === null ? null : v * escala; }
    if (m.tipo === 'gdp') return w0 + m.gdp * (tt - (o.inicioDias || 0));
    return w0 * Math.exp(m.tce / 100 * (tt - (o.inicioDias || 0)));
  };
  if (o.supervivenciaConstante) avisos.push('Supuesto explícito: la supervivencia se mantiene sin cambios (sin mortalidad).');
  else if (!(o.mortalidades || []).length) avisos.push('No hay mortalidades por período: se asume 0 % de mortalidad.');
  const tasas = o.tasas || [];
  if (!tasas.length) avisos.push('No hay tasas de alimentación: no se calcula el alimento ni el F.C.A.');
  else avisos.push('Si hay más períodos que tasas, se repite la última tasa.');

  const filaIni = (tt, p, w) => ({ dia: tt, fecha: o.fechaSiembra ? fechaDia(o.fechaSiembra, tt, planDias) : null, peso: w, pob: p, biomasa: biomasaKg(p, w, cfg), tasa: null, alimento: null, alimentoAcum: 0, incremento: null, fca: null, fcaAcum: null });
  const rows = [filaIni(t, pob, w0)];
  let truncado = null, alimAcum = 0, alimOk = tasas.length > 0;
  while (t < fin - 1e-9) {
    const d = Math.min(o.pasoDias, fin - t);
    const tn = t + d;
    const wn = pesoEn(tn);
    if (wn === null || !(wn > 0)) { truncado = t; break; }
    const f = o.supervivenciaConstante ? 1 : factorSupervivencia(o.mortalidades || [], planDias, t, d);
    let pn = pob * f;
    if (cfg.modoClase) pn = rEnt(pn);
    const bioIni = rows[rows.length - 1].biomasa;
    const bioFin = biomasaKg(pn, wn, cfg);
    const tasa = tasas.length ? tasas[Math.min(Math.floor(t / planDias + 1e-9), tasas.length - 1)] : null;
    let alim = tasa === null ? null : bioIni * tasa / 100 * d;
    if (alim !== null && cfg.modoClase) alim = r2(alim);
    if (alim !== null) alimAcum += alim;
    const inc = bioFin - bioIni;
    const fp = fca(alim, inc).valor;
    const fa = alimOk ? fca(alimAcum, bioFin - rows[0].biomasa).valor : null;
    rows.push({ dia: tn, fecha: o.fechaSiembra ? fechaDia(o.fechaSiembra, tn, planDias) : null, peso: wn, pob: pn, biomasa: bioFin, tasa, alimento: alim, alimentoAcum: alimOk ? alimAcum : null, incremento: inc, fca: fp, fcaAcum: fa });
    pob = pn; t = tn;
  }
  if (truncado !== null) avisos.push(`El plan de pesos termina antes del horizonte: la proyección se detiene en el día ${fmt(truncado, 0)}.`);
  const u = rows[rows.length - 1], p0 = rows[0];
  let diaObj = null, fechaObj = null, alcanza = false;
  if (o.pesoObjetivo > 0) {
    if (p0.peso >= o.pesoObjetivo) { alcanza = true; diaObj = p0.dia; }
    else for (let i = 1; i < rows.length; i++) {
      if (rows[i].peso >= o.pesoObjetivo) {
        const a = rows[i - 1], b = rows[i];
        diaObj = a.dia + (o.pesoObjetivo - a.peso) / (b.peso - a.peso) * (b.dia - a.dia);
        alcanza = true; break;
      }
    }
    if (alcanza && o.fechaSiembra) fechaObj = fechaDia(o.fechaSiembra, diaObj, planDias);
  }
  const incTotal = u.biomasa - p0.biomasa;
  return {
    rows, errores, avisos,
    resumen: {
      pesoFinal: u.peso, pobFinal: u.pob, biomasaFinal: u.biomasa, incrementoTotal: incTotal,
      alimentoTotal: alimOk ? alimAcum : null, fcaProyectado: alimOk ? fca(alimAcum, incTotal).valor : null,
      diaObjetivo: diaObj, fechaObjetivo: fechaObj, alcanzaObjetivo: alcanza, diaFinal: u.dia, truncadoEnDia: truncado
    }
  };
}

/* ---------- historial de mediciones ---------- */
function construirHistorial(state, e, pobIni, pesoIni) {
  const cfg = state.config;
  const regs = state.muestreos.filter((m) => m.estanqueId === e.id && m.activo !== false)
    .sort((a, b) => (a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : (a.creado || 0) - (b.creado || 0)));
  const bio0 = (pobIni !== null && pesoIni !== null) ? biomasaKg(pobIni, pesoIni, cfg) : null;
  let pobPrev = pobIni, bioPrev = bio0, alimAcum = 0, retAcum = 0, fechaPrev = e.fechaSiembra, pesoPrev = pesoIni;
  const out = [];
  for (const m of regs) {
    const peso = num(m.peso);
    let pob, pobFuente;
    if (num(m.poblacion) !== null) { pob = num(m.poblacion); pobFuente = 'registrada'; }
    else if (num(m.muertos) !== null && pobPrev !== null) { pob = pobPrev - num(m.muertos); pobFuente = 'según mortalidad registrada'; }
    else { pob = pobPrev; pobFuente = 'sin cambios registrados'; }
    const bio = (pob !== null && peso !== null) ? biomasaKg(pob, peso, cfg) : null;
    const usaConsumido = num(m.alimentoConsumido) !== null;
    const alim = usaConsumido ? num(m.alimentoConsumido) : num(m.alimentoSuministrado);
    const ret = num(m.biomasaRetirada) || 0;
    if (alim !== null) alimAcum += alim;
    retAcum += ret;
    const inc = (bio !== null && bioPrev !== null) ? bio + ret - bioPrev : null;
    const incAcum = (bio !== null && bio0 !== null) ? bio + retAcum - bio0 : null;
    const dPer = diasEntre(fechaPrev, m.fecha);
    out.push(Object.assign({}, m, {
      peso, pob, pobFuente, biomasa: bio, alimentoPeriodo: alim, usaConsumido, retirada: ret,
      incremento: inc, fcaPeriodo: fca(alim, inc), alimentoAcum: alimAcum, incrementoAcum: incAcum,
      fcaAcum: cfg.fcaTotalMetodo === 'cosecha' ? fca(alimAcum, bio !== null ? bio + retAcum : null) : fca(alimAcum, incAcum),
      dias: diasEntre(e.fechaSiembra, m.fecha), diasPeriodo: dPer,
      gananciaDia: (peso !== null && pesoPrev !== null && dPer > 0) ? (peso - pesoPrev) / dPer : null
    }));
    if (pob !== null) pobPrev = pob;
    if (bio !== null) bioPrev = bio;
    if (peso !== null) pesoPrev = peso;
    fechaPrev = m.fecha;
  }
  return { registros: out, bio0 };
}

/* ---------- análisis completo de un estanque ---------- */
function analizarEstanque(state, e, hoy) {
  const cfg = state.config;
  const esp = state.especies.find((x) => x.id === e.especieId) || null;
  const area = areaM2(e);
  const vol = volumenM3(area, e.profundidad);
  const nIni = num(e.poblacionInicial);
  const pobIni = nIni !== null ? nIni : ((num(e.densidad) !== null && area > 0) ? rEnt(num(e.densidad) * area) : null);
  const dens = densidad(pobIni, area);
  const mt = num(e.mortTransporte);
  const comprados = (pobIni !== null && mt !== null && mt >= 0 && mt < 100) ? techo(pobIni / (1 - mt / 100)) : null;
  const pesoIni = num(e.pesoInicial) !== null ? num(e.pesoInicial) : (esp ? num(esp.pesoInicial) : null);
  const pesoObj = num(e.pesoObjetivo) !== null ? num(e.pesoObjetivo) : (esp ? num(esp.pesoCosecha) : null);
  const precioVenta = num(e.precioVenta) !== null ? num(e.precioVenta) : (esp ? num(esp.precioKg) : null);
  const precioCompra = num(e.precioCompra) !== null ? num(e.precioCompra) : (esp ? num(esp.precioCompra) : null);
  const plan = planDe(e, esp);
  const hist = construirHistorial(state, e, pobIni, pesoIni);
  const regs = hist.registros;
  const ult = regs.length ? regs[regs.length - 1] : null;
  const dias = e.fechaSiembra && parseFecha(e.fechaSiembra) ? diasEntre(e.fechaSiembra, hoy) : null;

  let actual;
  if (ult && ult.peso !== null && ult.pob !== null) {
    actual = { fuente: 'real', fecha: ult.fecha, dias: ult.dias, peso: ult.peso, pob: ult.pob, biomasa: ult.biomasa };
  } else if (pobIni !== null && pesoIni !== null && plan.pesos.length && dias !== null && dias > 0) {
    const w = interpPlan(puntosPlan(plan, pesoIni), dias);
    let p = pobIni * factorSupervivencia(plan.mortalidades, plan.planDias, 0, dias);
    if (cfg.modoClase) p = rEnt(p);
    actual = w === null ? { fuente: 'inicial', fecha: e.fechaSiembra, dias: 0, peso: pesoIni, pob: pobIni, biomasa: biomasaKg(pobIni, pesoIni, cfg) }
      : { fuente: 'estimado', fecha: hoy, dias, peso: w, pob: p, biomasa: biomasaKg(p, w, cfg) };
  } else {
    actual = { fuente: 'inicial', fecha: e.fechaSiembra, dias: 0, peso: pesoIni, pob: pobIni, biomasa: (pobIni !== null && pesoIni !== null) ? biomasaKg(pobIni, pesoIni, cfg) : null };
  }
  const tasaActual = tasaPlanEn(plan, actual.dias || 0);
  const alimAcumReal = ult ? ult.alimentoAcum : 0;
  const mortAcum = (pobIni !== null && actual.pob !== null) ? pobIni - actual.pob : null;
  const superv = (pobIni > 0 && actual.pob !== null) ? actual.pob / pobIni * 100 : null;
  const supervEsp = esp ? (num(esp.supervivencia) !== null ? num(esp.supervivencia) : supervivenciaDesde(esp.mortalidadPeriodo)) : null;
  const k = area > 0 ? area / 10000 : null;
  return {
    e, esp, area, vol, pobIni, dens, densVol: vol ? pobIni / vol : null, comprados, pesoIni, pesoObj, precioVenta, precioCompra,
    plan, hist, regs, ult, dias, actual, tasaActual,
    alimDiario: alimentoDiario(actual.biomasa, tasaActual),
    alimAcumReal, mortAcum, superv, supervEsp,
    vivosEst: vivosEstimados(pobIni, supervEsp),
    biomasaHa: (actual.biomasa !== null && area > 0) ? actual.biomasa * 10000 / area : null,
    biomasaM3: (actual.biomasa !== null && vol) ? actual.biomasa / vol : null,
    incrementoPeso: (actual.peso !== null && pesoIni !== null) ? actual.peso - pesoIni : null,
    fcaAcum: ult ? ult.fcaAcum.valor : null,
    insumos: {
      calKg: k !== null && num(e.calKgHa) !== null ? num(e.calKgHa) * k : null,
      fertIniKg: k !== null && num(e.fertIniKgHa) !== null ? num(e.fertIniKgHa) * k : null,
      fertMensKg: k !== null && num(e.fertMensKgHa) !== null ? num(e.fertMensKgHa) * k : null
    }
  };
}

/* Proyección "por defecto" de un estanque hasta el final del plan (para economía y resumen) */
function proyeccionPlan(state, an, hoy) {
  const { e, plan, pesoIni, pobIni } = an;
  if (!plan.pesos.length || pobIni === null || pesoIni === null) return null;
  const real = an.actual.fuente === 'real';
  const inicio = real ? (an.actual.dias || 0) : 0;
  const finPlan = plan.pesos.length * plan.planDias;
  if (inicio >= finPlan) return null;
  return proyectar({
    cfg: state.config, inicioDias: inicio, fechaSiembra: e.fechaSiembra, pobInicial: real ? an.actual.pob : pobIni,
    pesoInicial: real ? an.actual.peso : pesoIni, pasoDias: plan.planDias, horizonteDias: finPlan - inicio, planDias: plan.planDias,
    modelo: { tipo: 'pesos', pesos: plan.pesos, pesoSiembra: pesoIni }, ajustarAReal: real,
    mortalidades: plan.mortalidades, supervivenciaConstante: false, tasas: plan.tasas, pesoObjetivo: an.pesoObj
  });
}

/* ---------- economía ---------- */
function economiaEstanque(state, an, hoy, proy) {
  const cfg = state.config, e = an.e;
  const costos = state.costos.filter((c) => c.estanqueId === e.id && num(c.monto) !== null);
  const aLinea = (c) => ({ categoria: c.categoria, monto: num(c.monto), auto: false, concepto: c.concepto });
  const reales = costos.filter((c) => c.tipo !== 'proyectado').map(aLinea);
  const proyec = costos.filter((c) => c.tipo === 'proyectado').map(aLinea);
  const auto = [];
  if (e.autoSemilla !== false && an.comprados !== null && an.precioCompra !== null) {
    const yaSembrado = e.fechaSiembra && e.fechaSiembra <= hoy;
    const linea = { categoria: CATEGORIAS_COSTO[0], monto: an.comprados * an.precioCompra, auto: true, concepto: `${fmt(an.comprados, 0)} organismos × ${fmt(an.precioCompra, 4)}` };
    (yaSembrado ? reales : proyec).push(linea); auto.push(linea);
  }
  const pAli = num(e.precioAlimento);
  if (e.autoAlimento !== false && pAli !== null) {
    const l1 = { categoria: CATEGORIAS_COSTO[1], monto: an.alimAcumReal * pAli, auto: true, concepto: `${fmt(an.alimAcumReal)} kg registrados × ${fmt(pAli, 2)}` };
    reales.push(l1); auto.push(l1);
    const resto = proy && proy.resumen && proy.resumen.alimentoTotal !== null ? proy.resumen.alimentoTotal : null;
    if (resto !== null && an.e.estado !== 'finalizado') {
      const l2 = { categoria: CATEGORIAS_COSTO[1], monto: resto * pAli, auto: true, concepto: `${fmt(resto)} kg proyectados × ${fmt(pAli, 2)}` };
      proyec.push(l2); auto.push(l2);
    }
  }
  const costoReal = suma(reales.map((c) => c.monto));
  const costoProy = suma(proyec.map((c) => c.monto));
  const costoTotal = costoReal + costoProy;
  const ing = state.ingresos.filter((i) => i.estanqueId === e.id && num(i.monto) !== null);
  const ingReal = suma(ing.filter((i) => i.tipo !== 'estimado').map((i) => num(i.monto)));
  const ingEstManual = suma(ing.filter((i) => i.tipo === 'estimado').map((i) => num(i.monto)));
  const kgProd = proy && proy.resumen ? proy.resumen.biomasaFinal : an.actual.biomasa;
  const kgVendidos = suma(ing.filter((i) => i.tipo !== 'estimado').map((i) => num(i.kg)));
  const ingVentaEst = (kgProd !== null && an.precioVenta !== null) ? kgProd * an.precioVenta : null;
  const ingEst = (ingVentaEst !== null ? ingVentaEst : 0) + ingEstManual;
  const ganReal = ingReal - costoReal;
  const ganEst = ingEst - costoTotal;
  const pobViva = proy && proy.resumen ? proy.resumen.pobFinal : an.actual.pob;
  return {
    reales, proyectados: proyec, auto,
    costoReal, costoProy, costoTotal,
    costoPorSembrado: div(costoTotal, an.pobIni), costoPorSobreviviente: div(costoTotal, pobViva),
    costoPorKg: div(costoTotal, kgProd), kgProd, kgVendidos,
    ingReal, ingEst, ingVentaEst, ingEstManual,
    ganReal, ganEst,
    margenReal: div(ganReal, ingReal), margenEst: div(ganEst, ingEst),
    puntoEquilibrioKg: div(costoTotal, an.precioVenta), precioMinimo: div(costoTotal, kgProd),
    proyectado: !!(proy && proy.resumen)
  };
}

/* ---------- granja: agregación ---------- */
function resumenGranja(state, hoy, filtro) {
  const f = filtro || {};
  const filas = [];
  for (const e of state.estanques) {
    if (f.especie && e.especieId !== f.especie) continue;
    if (f.estado && e.estado !== f.estado) continue;
    if (f.desde && (!e.fechaSiembra || e.fechaSiembra < f.desde)) continue;
    if (f.hasta && (!e.fechaSiembra || e.fechaSiembra > f.hasta)) continue;
    const an = analizarEstanque(state, e, hoy);
    const proy = proyeccionPlan(state, an, hoy);
    const eco = economiaEstanque(state, an, hoy, proy);
    filas.push({ an, proy, eco });
  }
  const activos = filas.filter((x) => x.an.e.estado === 'en crianza' || x.an.e.estado === 'en cosecha');
  const alimSum = suma(filas.map((x) => x.an.alimAcumReal));
  // FCA de granja: Σ alimento acumulado ÷ Σ incremento de biomasa (solo estanques con medición y F.C.A. calculable)
  const validos = filas.filter((x) => x.an.ult && x.an.ult.incrementoAcum > 0);
  const fcaGranja = validos.length ? div(suma(validos.map((x) => x.an.ult.alimentoAcum)), suma(validos.map((x) => x.an.ult.incrementoAcum))) : null;
  return {
    filas,
    kpi: {
      total: state.estanques.length, activos: activos.length,
      pobIni: suma(filas.map((x) => x.an.pobIni)), pobViva: suma(filas.map((x) => x.an.actual.pob)),
      biomasa: suma(filas.map((x) => x.an.actual.biomasa)),
      alimDiario: suma(filas.map((x) => x.an.alimDiario)), alimAcum: alimSum, fcaGranja,
      costo: suma(filas.map((x) => x.eco.costoReal)), costoTotal: suma(filas.map((x) => x.eco.costoTotal)),
      ingEst: suma(filas.map((x) => x.eco.ingEst)), ganProy: suma(filas.map((x) => x.eco.ganEst))
    }
  };
}

/* ---------- alertas ---------- */
function alerta(nivel, e, dato, porque, valor, corregir) {
  return { nivel, estanqueId: e ? e.id : null, codigo: e ? (e.codigo || '(sin código)') : 'General', dato, porque, valor, corregir };
}
function evaluarAlertas(state, hoy) {
  const A = [], cfg = state.config;
  const nueva = (...a) => A.push(alerta(...a));
  for (const esp of state.especies) {
    const sv = num(esp.supervivencia);
    if (sv !== null && (sv < 0 || sv > 100)) nueva('error', null, `Supervivencia de ${esp.nombre}`, 'La supervivencia debe estar entre 0 % y 100 %.', `${sv} %`, 'Corrige el valor en Configuración › Especies.');
    for (const t of esp.tasasPeriodo || []) if (t < 0) nueva('error', null, `Tasa de alimentación de ${esp.nombre}`, 'Una tasa negativa no es válida.', `${t} %`, 'Corrige la tasa en Configuración › Especies.');
    if (num(esp.precioKg) !== null && num(esp.precioKg) < 0) nueva('error', null, `Precio de venta de ${esp.nombre}`, 'Los precios no pueden ser negativos.', String(esp.precioKg), 'Corrige el precio.');
  }
  for (const e of state.estanques) {
    const an = analizarEstanque(state, e, hoy);
    const esp = an.esp;
    // --- datos obligatorios ---
    if (!esp) nueva('advertencia', e, 'Especie', 'Sin especie no se pueden aplicar parámetros ni proyecciones.', 'sin especie', 'Selecciona la especie en Estanques › Editar.');
    if (num(e.area) === null) nueva('advertencia', e, 'Área', 'Sin área no se calculan densidad, biomasa por hectárea ni insumos.', 'vacía', 'Escribe el área del estanque.');
    else if (num(e.area) <= 0) nueva('error', e, 'Área del estanque', 'El área debe ser mayor que cero.', `${e.area} ${e.areaUnidad === 'ha' ? 'ha' : 'm²'}`, 'Escribe un área positiva.');
    if (e.profundidad !== null && e.profundidad !== undefined && e.profundidad !== '' && num(e.profundidad) !== null && num(e.profundidad) < 0) nueva('error', e, 'Profundidad', 'La profundidad no puede ser negativa.', `${e.profundidad} m`, 'Corrige la profundidad.');
    if (!e.fechaSiembra) nueva('advertencia', e, 'Fecha de siembra', 'Sin fecha de siembra no se calculan días de cultivo ni proyecciones con fechas.', 'vacía', 'Indica la fecha de siembra.');
    else if (!parseFecha(e.fechaSiembra)) nueva('error', e, 'Fecha de siembra', 'La fecha no es válida.', e.fechaSiembra, 'Escribe una fecha válida.');
    if (e.fechaCosecha && e.fechaSiembra && e.fechaCosecha < e.fechaSiembra) nueva('error', e, 'Fecha de cosecha', 'La cosecha no puede ser anterior a la siembra.', `${fmtFecha(e.fechaCosecha)} < ${fmtFecha(e.fechaSiembra)}`, 'Corrige una de las dos fechas.');
    const nIniRaw = num(e.poblacionInicial);
    if (nIniRaw !== null && (nIniRaw < 0 || nIniRaw !== Math.floor(nIniRaw))) nueva('error', e, 'Número de organismos sembrados', 'Debe ser un número entero positivo.', String(e.poblacionInicial), 'Corrige la población inicial.');
    else if (an.pobIni === null) nueva('advertencia', e, 'Población inicial', 'Sin población no se calculan biomasa, alimento ni F.C.A.', 'vacía', 'Escribe el número sembrado o la densidad.');
    if (an.pesoIni === null) nueva('advertencia', e, 'Peso inicial', 'Sin peso inicial no se calcula la biomasa de siembra.', 'vacío', 'Indica el peso inicial o complétalo en la especie.');
    else if (an.pesoIni <= 0) nueva('error', e, 'Peso inicial', 'El peso promedio debe ser mayor que cero.', `${an.pesoIni} g`, 'Corrige el peso inicial.');
    for (const [k, etq] of [['precioCompra', 'Precio de compra por organismo'], ['precioAlimento', 'Precio del alimento'], ['precioVenta', 'Precio de venta']]) {

function crearStore(backend, key) {
  return {

      try {
        const raw = backend.getItem(key);
        if (!raw) return { state: estadoInicial(), nuevo: true };
        return { state: normalizarEstado(JSON.parse(raw)), nuevo: false };
      } catch (err) { return { state: estadoInicial(), nuevo: true, error: String(err) }; }

    guardar(state) {

function v_alim_live(state, ui, hoy) {

  });
  const totD = suma(filaGranja.map((x) => x.d));
  const tabla = `<div class="tarjeta"><h3>Alimentación de toda la granja</h3><div class="tabla-wrap"><table><thead><tr><th class="izq">Estanque</th><th>Biomasa (kg)</th><th>Tasa del plan (%)</th><th>Diario (kg)</th><th>Semanal (kg)</th><th>Mensual (kg)</th></tr></thead><tbody>${filaGranja.map(({ an, d }) => `<tr><td class="izq">${esc(an.e.codigo)}</td><td>${fmt(an.actual.biomasa)}</td><td>${an.tasaActual === null ? 'sin tasa' : fmt(an.tasaActual, 1)}</td><td>${fmt(d)}</td><td>${fmt(d === null ? null : d * 7)}</td><td>${fmt(d === null ? null : d * 30)}</td></tr>`).join('')}</tbody><tfoot><tr><td class="izq">Total granja</td><td>${fmt(suma(filaGranja.map((x) => x.an.actual.biomasa)))}</td><td></td><td>${fmt(totD)}</td><td>${fmt(totD * 7)}</td><td>${fmt(totD * 30)}</td></tr></tfoot></table></div><p class="sub" style="margin-top:8px">Semanal = diario × 7; mensual = diario × 30. Supone una tasa constante dentro de cada período; para más realismo, cambia la tasa según la etapa en Proyecciones o en la especie.</p></div>`;
  if (ui.sel === '__todos') return tabla;
  const e = state.estanques.find((x) => x.id === ui.sel) || state.estanques[0];
  if (!e) return '';
  const an = analizarEstanque(state, e, hoy);
  const out = [];
  const tasaUser = num(ui.ali.tasa);
  const tasa = tasaUser !== null ? tasaUser : an.tasaActual;
  const origen = tasaUser !== null ? 'escrita por ti' : 'del plan';
  if (tasaUser !== null && tasaUser < 0) out.push(aviso('error', 'La tasa de alimentación no puede ser negativa.'));
  const tMin = an.esp ? num(an.esp.tasaMin) : null, tMax = an.esp ? num(an.esp.tasaMax) : null;
  if (tasa !== null && tasa >= 0 && ((tMin !== null && tasa < tMin) || (tMax !== null && tasa > tMax))) out.push(aviso('adv', `La tasa ${fmt(tasa, 1)} % está fuera del rango configurado para ${esc(an.esp.nombre)} (${tMin ?? '—'} – ${tMax ?? '—'} %).`));

  else if (rac.fracs && dia !== null) racTxt = aviso('info', `Reparto del alimento diario en ${rac.fracs.length} raciones: ${rac.fracs.map((f) => fmt(dia * f) + ' kg').join(' · ')}`);
  const cards = [kpi('Biomasa actual', `${fmt(bio)} kg`, `${an.actual.fuente === 'real' ? 'REAL' : an.actual.fuente === 'estimado' ? 'ESTIMADA' : 'INICIAL'}`),

    kpi('Alimento diario', dia === null ? 'N/D' : `${fmt(dia)} kg`), kpi('Alimento semanal', dia === null ? 'N/D' : `${fmt(dia * 7)} kg`, 'diario × 7'),
    kpi('Alimento mensual', dia === null ? 'N/D' : `${fmt(dia * 30)} kg`, 'diario × 30'),
    kpi('Acumulado registrado', `${fmt(an.alimAcumReal)} kg`, 'suma de las mediciones'),
    kpi('Acumulado por ciclo (total)', totalCiclo === null ? 'N/D' : `${fmt(totalCiclo)} kg`, totalCiclo === null ? 'requiere un plan con pesos y tasas' : `registrado + proyectado (${fmt(resto)} kg) ${etq('proy')}`)].join('');
  // F.C.A.

  const incM = (num(fm.bioAct) !== null && num(fm.bioIni) !== null) ? num(fm.bioAct) + (num(fm.ret) || 0) - num(fm.bioIni) : null;
  const rm = fca(aliM, incM);
  const fcaMan = (num(fm.sum) === null && num(fm.cons) === null) ? '' : (rm.valor === null ? aviso('adv', esc(rm.motivo)) : aviso('ok', `F.C.A. calculado: <b>${fmt(rm.valor)}</b> = ${fmt(aliM)} kg ÷ ${fmt(incM)} kg ${num(fm.cons) !== null ? '(con alimento consumido)' : '(con alimento suministrado)'}`));
  const u = an.ult;

  const seg = u ? `<div class="tabla-wrap"><table><thead><tr><th class="izq">Fecha</th><th>Alimento período (kg)</th><th>Incremento biomasa (kg)</th><th>F.C.A. período</th><th>F.C.A. acumulado</th></tr></thead><tbody>${an.regs.map((r) => `<tr><td class="izq">${fmtFecha(r.fecha)}</td><td>${fmt(r.alimentoPeriodo)}${r.usaConsumido ? ' (consumido)' : ''}</td><td>${fmt(r.incremento)}</td><td>${r.fcaPeriodo.valor === null ? `<span title="${esc(r.fcaPeriodo.motivo)}">N/D</span>` : fmt(r.fcaPeriodo.valor)}</td><td>${r.fcaAcum.valor === null ? 'N/D' : fmt(r.fcaAcum.valor)}</td></tr>`).join('')}</tbody></table></div>` : vacio('Aún no hay mediciones para monitorear el F.C.A.');
  const fcaCards = [kpi('F.C.A. acumulado (real)', u && u.fcaAcum.valor !== null ? `${fmt(u.fcaAcum.valor)} ${etq('real')}` : 'N/D'), kpi('F.C.A. del último período (real)', u && u.fcaPeriodo.valor !== null ? fmt(u.fcaPeriodo.valor) : 'N/D'),

  return `${out.join('')}<div class="grid kpis">${cards}</div>${racTxt}${tabla}
    <div class="tarjeta"><h3>Monitoreo del F.C.A. · ${esc(e.codigo)}</h3>${fcaMan}<div class="grid kpis" style="margin:10px 0">${fcaCards}</div>${seg}
    <details class="plegable"><summary>Método de cálculo</summary><p>Período: <span class="formula">alimento del período ÷ (biomasa actual + biomasa retirada − biomasa anterior)</span>. Acumulado: <span class="formula">${esc(metodo)}</span>. Se usa el alimento <b>consumido</b> cuando se registra y, si no, el <b>suministrado</b>. La biomasa de los peces muertos no se suma al incremento (se trabaja con biomasa viva) y las cosechas parciales o retiros se suman al incremento mediante «biomasa retirada». Si el incremento es cero o negativo no se calcula el F.C.A. y se muestra una advertencia.</p></details></div>`;
}

/* ---------- PROYECCIONES ---------- */
function iniciarProyUI(state, ui, hoy) {
  const e = state.estanques.find((x) => x.id === ui.sel);
  ui.proyFor = ui.sel;
  if (!e) return;
  const an = analizarEstanque(state, e, hoy);
  ui.proy = { plazo: 'largo', cant: '', unidad: 'dias', inicio: an.regs.length ? 'real' : 'siembra', modelo: 'pesos', pesos: an.plan.pesos.join(', '), gdp: '', tce: '', mort: an.plan.mortalidades.join(', '),
    tasas: an.plan.tasas.join(', '), paso: '', superConst: false, planDias: String(an.plan.planDias), fechaCosecha: e.fechaCosecha || '', ajustar: true };

function v_proyecciones(state, ui, hoy) {

  return `<h2>Proyecciones</h2><p class="sub">Crecimiento, población, biomasa y alimento a corto, mediano y largo plazo con un modelo explícito. Nada se asume en silencio: los supuestos se listan junto al resultado.</p>

  <div class="tarjeta"><h3>Horizonte y modelo</h3><div class="grid">
    ${selc({ etq: 'Plazo', opciones: opt([['corto', 'Corto plazo (días o semanas)'], ['mediano', 'Mediano plazo (meses)'], ['largo', 'Largo plazo (hasta la cosecha)']]), valor: p.plazo, ui: 'proy.plazo', rerender: true })}
    ${p.plazo === 'corto' ? selc({ etq: 'Unidad', opciones: [['dias', 'días'], ['semanas', 'semanas']], valor: p.unidad, ui: 'proy.unidad' }) + inpt({ etq: 'Cantidad', valor: p.cant, ui: 'proy.cant', min: 1 }) : ''}
    ${p.plazo === 'mediano' ? inpt({ etq: 'Cantidad de meses (de 30 días)', valor: p.cant, ui: 'proy.cant', min: 1 }) : ''}
    ${p.plazo === 'largo' ? inpt({ etq: 'Fecha estimada de cosecha', tipo: 'date', valor: p.fechaCosecha, ui: 'proy.fechaCosecha', ayuda: 'Vacía = fin del plan de pesos.' }) : ''}
    ${selc({ etq: 'Punto de partida', opciones: [['real', 'Última medición real'], ['siembra', 'Siembra (plan inicial)']], valor: p.inicio, ui: 'proy.inicio' })}
    ${inpt({ etq: 'Paso de cálculo (vacío = automático)', unidad: 'días', valor: p.paso, ui: 'proy.paso', min: 1, ayuda: 'Cada paso calcula el alimento con la biomasa del inicio del paso.' })}
    ${selc({ etq: 'Modelo de crecimiento', opciones: [['pesos', 'Pesos esperados por período (interpolación lineal)'], ['gdp', 'Ganancia diaria constante (g/día)'], ['tce', 'Crecimiento específico constante (%/día)']], valor: p.modelo, ui: 'proy.modelo', rerender: true })}
    ${p.modelo === 'pesos' ? inpt({ etq: 'Pesos esperados al final de cada período', tipo: 'text', valor: p.pesos, ui: 'proy.pesos', unidad: 'g', ayuda: 'Separados por comas, desde la siembra.' }) + inpt({ etq: 'Días de cada período del plan', valor: p.planDias, ui: 'proy.planDias', min: 1 }) : ''}
    ${p.modelo === 'gdp' ? inpt({ etq: 'Ganancia diaria de peso', valor: p.gdp, ui: 'proy.gdp', unidad: 'g/día' }) : ''}
    ${p.modelo === 'tce' ? inpt({ etq: 'Tasa de crecimiento específico', valor: p.tce, ui: 'proy.tce', unidad: '%/día' }) : ''}
    ${inpt({ etq: 'Mortalidad de cada período', tipo: 'text', valor: p.mort, ui: 'proy.mort', unidad: '%', ayuda: 'Por período del plan. Vacío = sin mortalidad.' })}
    ${inpt({ etq: 'Tasa de alimentación de cada período', tipo: 'text', valor: p.tasas, ui: 'proy.tasas', unidad: '%', ayuda: 'Una por período; se repite la última.' })}</div>
    <div class="grid" style="margin-top:8px"><div class="campo"><label><input type="checkbox" data-ui="proy.superConst"${p.superConst ? ' checked' : ''} style="width:auto;min-height:0"> Suponer supervivencia constante (sin mortalidad)</label><span class="ayuda">Supuesto explícito: úsalo solo si lo quieres.</span></div>
    ${p.modelo === 'pesos' ? `<div class="campo"><label><input type="checkbox" data-ui="proy.ajustar"${p.ajustar ? ' checked' : ''} style="width:auto;min-height:0"> Ajustar el plan al peso real de la última medición</label><span class="ayuda">Aplica la proporción real/plan a los pesos siguientes.</span></div>` : ''}</div>
    <div class="acciones"><button class="btn sec" type="button" data-accion="guardarPlan">Guardar como plan del estanque</button><button class="btn sec" type="button" data-accion="restaurarPlan">Restaurar plan de la especie</button></div></div>
  <div id="live">${v_proy_live(state, ui, hoy)}</div>`;
}
function calcularProyeccion(state, ui, hoy) {
  const e = state.estanques.find((x) => x.id === ui.sel);
  if (!e) return { errores: ['Selecciona un estanque.'] };
  if (!ui.proy || ui.proyFor !== ui.sel) iniciarProyUI(state, ui, hoy);
  const p = ui.proy, an = analizarEstanque(state, e, hoy);
  const pesos = parseLista(p.pesos), mort = parseLista(p.mort), tasas = parseLista(p.tasas);
  const errores = [];
  if (pesos === null) errores.push('Los pesos esperados deben ser números separados por comas.');
  if (mort === null) errores.push('Las mortalidades deben ser números separados por comas.');
  if (tasas === null) errores.push('Las tasas deben ser números separados por comas.');
  if ((pesos || []).some((v) => v <= 0)) errores.push('Los pesos esperados deben ser mayores que cero.');
  if ((mort || []).some((v) => v < 0 || v >= 100)) errores.push('Las mortalidades deben estar entre 0 y 100 %.');
  if ((tasas || []).some((v) => v < 0)) errores.push('Las tasas no pueden ser negativas.');
  const planDias = num(p.planDias);
  if (p.modelo === 'pesos' && !(planDias > 0)) errores.push('Los días de cada período deben ser mayores que cero.');
  if (an.pobIni === null || an.pesoIni === null) errores.push('Faltan la población inicial o el peso inicial del estanque.');
  if (errores.length) return { errores, an };
  const real = p.inicio === 'real' && an.actual.fuente === 'real';
  const inicio = real ? (an.actual.dias || 0) : 0;
  const pd = planDias || an.plan.planDias;
  let horizonte;
  if (p.plazo === 'corto') { const c = num(p.cant); if (!(c > 0)) return { errores: ['Indica la cantidad de días o semanas.'], an }; horizonte = c * (p.unidad === 'semanas' ? 7 : 1); }
  else if (p.plazo === 'mediano') { const c = num(p.cant); if (!(c > 0)) return { errores: ['Indica la cantidad de meses.'], an }; horizonte = c * 30; }
  else {
    let finDia = null;
    if (p.fechaCosecha && e.fechaSiembra) finDia = diasEntre(e.fechaSiembra, p.fechaCosecha);
    else if (p.modelo === 'pesos' && (pesos || []).length) finDia = pesos.length * pd;
    if (finDia !== null && p.modelo === 'pesos' && (pesos || []).length && finDia > pesos.length * pd && finDia - pesos.length * pd <= 3) finDia = pesos.length * pd; // 2 ene → 2 jul = 181 días ≈ 6 meses de 30 días
    if (finDia === null) return { errores: ['Para el largo plazo indica la fecha estimada de cosecha (y la fecha de siembra del estanque).'], an };
    horizonte = finDia - inicio;
    if (!(horizonte > 0)) return { errores: ['La fecha estimada de cosecha ya pasó respecto del punto de partida.'], an };
  }
  const paso = num(p.paso) > 0 ? num(p.paso) : (p.plazo === 'corto' ? (horizonte <= 14 ? 1 : 7) : pd);
  const proy = proyectar({
    cfg: state.config, inicioDias: inicio, fechaSiembra: e.fechaSiembra, pobInicial: real ? an.actual.pob : an.pobIni, pesoInicial: real ? an.actual.peso : an.pesoIni,
    pasoDias: paso, horizonteDias: horizonte, planDias: pd, modelo: { tipo: p.modelo, pesos, pesoSiembra: an.pesoIni, gdp: num(p.gdp), tce: num(p.tce) }, ajustarAReal: !!p.ajustar && real,
    mortalidades: mort || [], supervivenciaConstante: !!p.superConst, tasas: tasas || [], pesoObjetivo: an.pesoObj
  });
  return { proy, an, real, inicio, horizonte, paso };
}
function v_proy_live(state, ui, hoy) {
  const r = calcularProyeccion(state, ui, hoy);
  if (r.errores && r.errores.length) return r.errores.map((t) => aviso('error', esc(t))).join('');
  const { proy, an } = r, cfg = state.config;
  if (proy.errores.length) return proy.errores.map((t) => aviso('error', esc(t))).join('');
  const s = proy.resumen;
  const sup = `<ul>${proy.avisos.map((t) => `<li>${esc(t)}</li>`).join('')}<li>Punto de partida: ${r.real ? `última medición real (día ${r.inicio}, ${fmt(an.actual.peso)} g, ${fmt(an.actual.pob, 0)} org.)` : 'siembra'}. Paso de cálculo: ${r.paso} día(s); horizonte: ${fmt(r.horizonte, 0)} día(s).</li><li>Alimento por paso = biomasa al inicio del paso × tasa × días del paso.</li></ul>`;
  const cards = [kpi('Peso promedio futuro', `${fmt(s.pesoFinal)} g`, `día ${fmt(s.diaFinal, 0)}`), kpi('Población viva estimada', fmt(s.pobFinal, 0)), kpi('Biomasa futura', `${fmt(s.biomasaFinal)} kg`),
    kpi('Incremento de biomasa', `${fmt(s.incrementoTotal)} kg`), kpi('Consumo de alimento', s.alimentoTotal === null ? 'N/D' : `${fmt(s.alimentoTotal)} kg`, 'del horizonte'), kpi('F.C.A. proyectado', s.fcaProyectado === null ? 'N/D' : fmt(s.fcaProyectado)),
    kpi('Producción estimada para cosecha', `${fmt(s.biomasaFinal)} kg`, 'biomasa al final del horizonte'),
    kpi('Fecha estimada del peso objetivo', an.pesoObj ? (s.alcanzaObjetivo ? (s.fechaObjetivo ? fmtFecha(s.fechaObjetivo) : `día ${fmt(s.diaObjetivo, 0)}`) : 'no se alcanza en el horizonte') : 'sin peso objetivo', an.pesoObj ? `objetivo: ${fmt(an.pesoObj)} g` : 'define el peso objetivo en el estanque o la especie')].join('');
  const filas = proy.rows.map((x, i) => `<tr><td class="izq">${x.fecha ? fmtFecha(x.fecha) : '—'}</td><td>${fmt(x.dia, 0)}</td><td>${fmt(x.peso)}</td><td>${fmt(x.pob, 0)}</td><td>${fmt(x.biomasa)}</td><td>${i ? fmt(x.incremento) : '—'}</td><td>${x.tasa === null ? '—' : fmt(x.tasa, 1)}</td><td>${x.alimento === null ? '—' : fmt(x.alimento)}</td><td>${x.fca === null ? '—' : fmt(x.fca)}</td></tr>`).join('');
  const regPts = (f) => an.regs.filter((q) => q.dias !== null && f(q) !== null).map((q) => ({ x: q.dias, y: f(q) }));
  const S = [{ nombre: 'Peso promedio', color: '#1f6f4a', tipo: 'real', puntos: [{ x: 0, y: an.pesoIni }].concat(regPts((q) => q.peso)) }, { nombre: 'Peso promedio', color: '#1d5fa8', tipo: 'proy', puntos: proy.rows.map((x) => ({ x: x.dia, y: x.peso })) }];
  const B = [{ nombre: 'Biomasa', color: '#1f6f4a', tipo: 'real', puntos: (an.hist.bio0 !== null ? [{ x: 0, y: an.hist.bio0 }] : []).concat(regPts((q) => q.biomasa)) }, { nombre: 'Biomasa', color: '#1d5fa8', tipo: 'proy', puntos: proy.rows.map((x) => ({ x: x.dia, y: x.biomasa })) }];
  return `<div class="aviso info"><b>Supuestos de esta proyección</b>${sup}</div><div class="grid kpis">${cards}</div>
  <div class="grid g2" style="margin-top:12px"><div class="tarjeta"><h3>Peso: real vs proyectado</h3>${svgLineas(S, { titulo: 'Peso real y proyectado', ejeY: 'Peso (g)' })}</div><div class="tarjeta"><h3>Biomasa: real vs proyectada</h3>${svgLineas(B, { titulo: 'Biomasa real y proyectada', ejeY: 'Biomasa (kg)' })}</div></div>
  <div class="tarjeta"><h3>Detalle de la proyección ${etq('proy')}</h3><div class="tabla-wrap"><table><thead><tr><th class="izq">Fecha</th><th>Día</th><th>Peso (g)</th><th>Población</th><th>Biomasa (kg)</th><th>Incremento (kg)</th><th>Tasa (%)</th><th>Alimento (kg)</th><th>F.C.A.</th></tr></thead><tbody>${filas}</tbody></table></div><p class="sub" style="margin-top:6px">Los valores de esta tabla son proyecciones (${esc(cfg.modoClase ? 'modo clase: población entera y kg a 2 decimales' : 'precisión completa')}), no datos reales.</p></div>`;
}

  const pts = an.pesoIni !== null && an.plan.pesos.length ? puntosPlan(an.plan, an.pesoIni) : null;
  let prevF = e.fechaSiembra;
  const filas = an.regs.map((r) => {
    const pp = pts && r.dias !== null ? interpPlanTol(pts, r.dias) : null;
    const dev = pp && r.peso !== null ? (r.peso - pp) / pp * 100 : null;
    const cos = suma(state.costos.filter((c) => c.estanqueId === e.id && c.tipo !== 'proyectado' && c.fecha > (prevF || '') && c.fecha <= r.fecha).map((c) => num(c.monto)));
    const ing = suma(state.ingresos.filter((c) => c.estanqueId === e.id && c.tipo !== 'estimado' && c.fecha > (prevF || '') && c.fecha <= r.fecha).map((c) => num(c.monto)));

  }).join('');

  if (id === '__todos') {
    const G = resumenGranja(state, hoy, {}), k = G.kpi;
    return `${barra}<h1>Reporte de la granja</h1><p>Generado el ${fmtFecha(hoy)} · Moneda: ${esc(cfg.moneda)}</p>${kv([['Estanques registrados', fmt(k.total, 0)], ['Estanques activos', fmt(k.activos, 0)], ['Población inicial total', fmt(k.pobIni, 0)], ['Población viva', fmt(k.pobViva, 0)], ['Biomasa total actual', `${fmt(k.biomasa)} kg`], ['Alimento diario requerido', `${fmt(k.alimDiario)} kg`], ['Alimento acumulado', `${fmt(k.alimAcum)} kg`], ['F.C.A. de la granja (Σ alimento ÷ Σ incremento de biomasa)', k.fcaGranja === null ? 'N/D' : fmt(k.fcaGranja)], ['Costo acumulado', fmtMon(k.costo, cfg)], ['Ingresos estimados', fmtMon(k.ingEst, cfg)], ['Ganancia / pérdida proyectada', fmtMon(k.ganProy, cfg)]])}

  async quitarEjemplo() { if (!(await confirmar('¿Quitar los datos de ejemplo?', 'Solo se borran los registros marcados como EJEMPLO.', 'Quitar'))) return; quitarEjemplo(state); guardar(); render(); },
  async borrarTodo() {
    if (!(await confirmar('¿Borrar TODOS los datos?', 'Se eliminarán estanques, mediciones, costos, ingresos y especies personalizadas. Descarga un respaldo antes si lo necesitas.', 'Borrar todo'))) return;
    state = estadoInicial(); ui = uiInicial(); guardar(); render();
  },
  exportarCSV(id) {
    const hoja = tablasExport(state, hoyISO()).find((h) => h.nombre.toLowerCase() === id);
    descargar(`acuicola_${id}_${hoyISO()}.csv`, aCSV(hoja.filas), 'text/csv;charset=utf-8');
  },
  exportarHistorialCSV() {
    const e = state.estanques.find((x) => x.id === ui.sel);
    const hoja = tablasExport(state, hoyISO()).find((h) => h.nombre === 'Historial');
    descargar(`acuicola_historial_${e.codigo}_${hoyISO()}.csv`, aCSV([hoja.filas[0]].concat(hoja.filas.slice(1).filter((f) => f[0] === e.codigo))), 'text/csv;charset=utf-8');
  },
  exportarExcel() { descargar(`acuicola_${hoyISO()}.xls`, aExcelXML(tablasExport(state, hoyISO())), 'application/vnd.ms-excel'); },
  exportarJSON() { descargar(`acuicola_respaldo_${hoyISO()}.json`, JSON.stringify(state, null, 2), 'application/json'); },
  reporte(id) { document.getElementById('reporte').innerHTML = v_reporte(state, id, hoyISO()); document.body.classList.add('ver-reporte'); document.getElementById('reporte').scrollTop = 0; },
  cerrarReporte() { document.body.classList.remove('ver-reporte'); },
  imprimir() { window.print(); },
  irProduccion() { irA('produccion'); }
};

/* ---------- eventos ---------- */
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-tab],[data-accion]');
  if (!t) return;
  if (t.dataset.tab) { irA(t.dataset.tab); const b = document.getElementById(`tab-${t.dataset.tab}`); if (b) b.focus(); return; }
  ev.preventDefault();
  const fn = ACCIONES[t.dataset.accion];
  if (fn) fn(t.dataset.id);
});
document.addEventListener('keydown', (ev) => {
  const b = ev.target.closest && ev.target.closest('nav.tabs button');
  if (!b || (ev.key !== 'ArrowRight' && ev.key !== 'ArrowLeft')) return;
  const ks = TABS.map((x) => x[0]), i = ks.indexOf(b.dataset.tab);
  const n = ks[(i + (ev.key === 'ArrowRight' ? 1 : ks.length - 1)) % ks.length];
  irA(n); document.getElementById(`tab-${n}`).focus();
});
document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (el.closest('#form-estanque')) { if (el.name) actualizarFormEstanque(el.name); return; }
  if (el.dataset.ui) {
    setPath(ui, el.dataset.ui, el.type === 'checkbox' ? el.checked : el.value);
    if (!el.dataset.rerender && el.tagName !== 'SELECT') refrescarLive();
    return;
  }
  if (el.dataset.est) {
    const e = state.estanques.find((x) => x.id === ui.sel);
    if (e) { e[el.dataset.est] = el.value; guardar(); refrescarLive(); }
  }
});
document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.id === 'archivo-respaldo') { importarRespaldo(el.files[0]); el.value = ''; return; }
  if (el.dataset.estchk) { const e = state.estanques.find((x) => x.id === ui.sel); if (e) { e[el.dataset.estchk] = el.checked; guardar(); refrescarLive(); } return; }
  if (el.dataset.cfg) {
    const k = el.dataset.cfg;
    state.config[k] = k === 'modoClase' ? el.value === '1' : (el.type === 'number' ? (num(el.value) ?? state.config[k]) : el.value);
    guardar(); toast('Ajuste guardado.'); ui.proyFor = null; render(); return;
  }
  if (el.dataset.ui && (el.dataset.rerender || el.tagName === 'SELECT')) {
    setPath(ui, el.dataset.ui, el.value);
    if (el.dataset.ui === 'sel') { ui.ali.tasa = ''; ui.medCorrige = null; ui.med = medVacia(); ui.proyFor = null; }
    render();
  }
});
document.addEventListener('submit', (ev) => {
  if (ev.target.closest('dialog')) return;   // el cuadro de confirmación se cierra solo (method="dialog")
  ev.preventDefault();
  const id = ev.target.id;
  if (id === 'form-estanque') guardarEstanque();
  else if (id === 'form-medicion') guardarMedicion();
  else if (id === 'form-costo') agregarCosto();
  else if (id === 'form-ingreso') agregarIngreso();
  else if (id === 'form-especie') guardarEspecie();
});
async function importarRespaldo(archivo) {
  if (!archivo) return;
  try {
    const obj = JSON.parse(await archivo.text());
    const err = validarRespaldo(obj);
    if (err) { toast(err); return; }
    if (!(await confirmar('¿Restaurar este respaldo?', 'Reemplazará todos los datos actuales.', 'Restaurar'))) return;
    state = normalizarEstado(obj); ui = uiInicial(); guardar(); toast('Respaldo restaurado.'); render();
  } catch (e) { toast('No se pudo leer el archivo de respaldo.'); }
}

/* ---------- arranque ---------- */
(function iniciar() {
  const r = store.cargar();
  state = r.state; ui = uiInicial();
  if (r.error) toast('No se pudieron leer los datos guardados; se inició con datos vacíos.');
  if (!almacenamientoPersistente) toast('Este navegador no permite guardar datos: se conservarán solo mientras la pestaña esté abierta.');
  render();
  const el = $('#estado-guardado');
  el.textContent = r.nuevo ? 'Sin datos guardados todavía' : 'Datos cargados';
  window.__acuicola = { get estado() { return state; }, get ui() { return ui; } };
})();

</script>
